name: Update GitHub activity statistics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/user-statistician.yml'
  schedule:
    # 매일 오전 3시 30분 (KST)에 실행됩니다. GitHub Actions의 cron은 UTC 기준입니다.
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate activity statistics card
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate statistics card
        uses: cicirello/user-statistician@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
